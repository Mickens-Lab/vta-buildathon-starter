# Disposable VTA for the buildathon. NOT for production: plaintext seed,
# loopback DID, http, no mediator.
#
#   npm run up      # keygen + compose up --wait + provision
#   npm run reset   # blank VTA (new DID, empty ACL)
#
# MODE=tunnel adds the `messaging` profile (redis + mediator) and public quick-tunnel hosts that
# `npm run up` passes in as VTA_PUBLIC_HOST / VTC_PUBLIC_HOST / MEDIATOR_PUBLIC_HOST / MEDIATOR_DID;
# without them every service behaves exactly as in local mode. See docs/MODES.md.
#
# MODE=farm skips all of this: see docs/FARM.md.
# Images: `npm run up` picks them (a prebuilt registry image, else a local build; docs/IMAGES.md) and exports
# VTA_IMAGE / VTC_IMAGE / MEDIATOR_IMAGE. Run by hand, compose uses the local tags below
# (`npm run images:build`), or set the variables yourself.
services:
  vta:
    image: ${VTA_IMAGE:-vta-buildathon:local}
    entrypoint: ["/bin/sh", "/vta-entrypoint.sh"]
    command: []
    env_file: .vta/admin.env
    environment:
      # Lets the VTA resolve its own did:webvh on a loopback host. Dev only.
      VTA_ALLOW_PRIVATE_ENDPOINTS: "${VTA_ALLOW_PRIVATE_ENDPOINTS:-1}"
      VTA_PORT: "${VTA_PORT:-8100}"
      # MODE=tunnel only (empty = local mode): the VTA's public host and the mediator it uses.
      PUBLIC_HOST: "${VTA_PUBLIC_HOST:-}"
      MEDIATOR_DID: "${MEDIATOR_DID:-}"
      CORS_ORIGINS_TOML: "${CORS_ORIGINS_TOML:-}"
      # Approvals demo (npm run approvals:setup writes this to .env): seeds a consent rule on first boot. Empty = off.
      APPROVER_DID: "${APPROVER_DID:-}"
    ports:
      - "127.0.0.1:${VTA_PORT:-8100}:${VTA_PORT:-8100}"
      # The VTC shares this container's network namespace (see `vtc` below), so its
      # port is published here.
      - "127.0.0.1:${VTC_PORT:-8200}:${VTC_PORT:-8200}"
    volumes:
      - vta-data:/var/lib/vta
      - ./vta-entrypoint.sh:/vta-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${VTA_PORT}/health >/dev/null && wget -qO- http://localhost:$${VTA_PORT}/.well-known/did.jsonl >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional VTC, behind a compose profile: `docker compose --profile vtc up -d`
  # (or `WITH_VTC=1 npm run up`). Verified against vtc-service 0.15.0 (docs/VTC.md).
  # The VTA image does not contain the VTC. Build one with docker/vtc.Dockerfile (see
  # docs/VTC.md) or point VTC_IMAGE at one you were given.
  vtc:
    profiles: ["vtc"]
    image: ${VTC_IMAGE:-vtc-buildathon:local}
    # Share the VTA's network namespace so the VTA's loopback DID host
    # (localhost:8100) is reachable from the VTC during setup and at runtime.
    network_mode: "service:vta"
    depends_on:
      vta:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/vtc-entrypoint.sh"]
    command: []
    env_file: .vta/admin.env
    user: "1000"
    environment:
      VTA_ALLOW_PRIVATE_ENDPOINTS: "${VTA_ALLOW_PRIVATE_ENDPOINTS:-1}"
      VTA_PORT: "${VTA_PORT:-8100}"
      # MODE=tunnel only (empty = local mode).
      PUBLIC_HOST: "${VTC_PUBLIC_HOST:-}"
      MEDIATOR_DID: "${MEDIATOR_DID:-}"
      MEDIATOR_HOST: "${MEDIATOR_PUBLIC_HOST:-}"
      VTC_PORT: "${VTC_PORT:-8200}"
      VTC_SERVER_PORT: "${VTC_PORT:-8200}"
      VTC_CONTEXT: "${VTC_CONTEXT:-vtc}"
      VTC_CORS_ORIGINS_TOML: "${VTC_CORS_ORIGINS_TOML:-}"
    volumes:
      - vtc-data:/var/lib/vtc
      - ./vtc-entrypoint.sh:/vtc-entrypoint.sh:ro

  # MODE=tunnel only: `docker compose --profile messaging ...` (npm run up does this).
  # Redis holds the mediator's queues in memory only; nothing is kept across restarts.
  redis:
    profiles: ["messaging"]
    image: ${REDIS_IMAGE:-redis:7.4.6-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The messaging mediator, OPEN ACL (any DID may register and relay): DEV ONLY, see
  # mediator-entrypoint.sh and docs/MODES.md. Build the image with `npm run images:build mediator`.
  # Its DID is a short did:webvh bound to MEDIATOR_HOST, which it serves itself at /.well-known/did.jsonl
  # (short so a did:peer:2 applicant naming it fits the resolver's 1000 bytes; docs/MESSAGING.md).
  mediator:
    profiles: ["messaging"]
    image: ${MEDIATOR_IMAGE:-mediator-buildathon:local}
    entrypoint: ["/bin/sh", "/mediator-entrypoint.sh"]
    command: []
    # Starts as root to write the volume; the entrypoint then drops to uid 10002.
    user: "0:0"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MEDIATOR_HOST: "${MEDIATOR_PUBLIC_HOST:-}"
      REDIS_URL: "redis://redis:6379/"
      # Optional browser access (default unset = off), e.g. http://localhost:5173. See docs/MODES.md.
      MEDIATOR_CORS_ALLOW_ORIGIN: "${MEDIATOR_CORS_ALLOW_ORIGIN:-}"
    ports:
      - "127.0.0.1:${MEDIATOR_PORT:-7037}:7037"
    volumes:
      - mediator-data:/conf
      - ./mediator-entrypoint.sh:/mediator-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7037/mediator/v1/livez >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  vta-data:
  vtc-data:
  mediator-data:
